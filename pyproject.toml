[project]
name = "omc"
version = "0.1.28"
description = "Oh My Clanker! Turn a ticket into a prepared worktree with a seeded LLM session."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mininterface>=1.4,<1.5",
    "pyyaml>=6,<7",
    "filelock>=3,<4",
    "iterm2>=2.24,<3; sys_platform == 'darwin'",
]

[project.scripts]
omc = "omc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.8",
    "testcontainers>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omc"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "omc/assets/skills"

# Stamp build-time provenance into omc/_buildinfo.py inside built artifacts (see
# hatch_build.py). Runs for both `uv tool install <repo>` and `uv tool install git+…`.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: dockerized end-to-end tests (opt-in, slow, real LLMs)",
    "local_iterm2: macOS native tier — launches a private iTerm2 instance and real provider TUIs (just iterm2-tests)",
    "e2e_provider(name): declare provider intent for E2E container prerequisites",
    "expensive: LLM-heavy E2E (documentation generation) - run only with explicit user agreement",
    "codex_gate: Codex integration cases; serial on the account volume (just codex-gate)",
    "golden: ordered golden-path stage; run with -n 0 (scripts/e2e.sh phase 1)",
    "variation(stage): forks a container from a golden stage snapshot",
]
# Every test has a 5-minute ceiling; only the `expensive` tier may override it
# with @pytest.mark.timeout. SIGALRM interrupts subprocess.communicate cleanly;
# the thread method cannot interrupt and takes the whole xdist worker down.
timeout = 300
timeout_method = "signal"
# The ceiling covers the test body only: fixture teardown (container stop,
# Codex auth copy-back) must always run to completion.
timeout_func_only = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# ruff 0.16 started formatting fenced code blocks inside markdown; the docs
# tree holds dated design/plan RECORDS whose code snippets must stay verbatim.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# wtconfig embeds the wt.toml starter verbatim; its shell one-liner exceeds 100 cols.
"src/omc/wtconfig.py" = ["E501"]
